# Runs the library tests and verifies both bundled examples compile.
#
# Fitz itself is installed via `cargo install --git` from the language
# repo. The compiled binary is cached across runs so subsequent CI is
# fast (first run takes ~4 min for the cold build, ~30 sec after that).
#
# IMPORTANT: the cache key is fixed, and the install step only runs when the
# binary is absent — so the cached `fitz` is frozen at whatever version first
# built it. When the library starts using a NEW fitz-core feature (e.g. FLV-03
# uses `Map.remove` from core v0.50.0), BUMP the cache key (`-vN` → `-v(N+1)`)
# so CI reinstalls a fresh `fitz` from `main`. Otherwise the stale binary fails
# to type-check `lib.fitz`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: fitz test + examples compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and Fitz binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/fitz
          # Bumped v1 → v2 (v0.49.0): FLV-03 uses `Map.remove` (fitz core v0.50.0);
          # the old cached `fitz` predates it and can't type-check `lib.fitz`.
          key: cargo-fitz-${{ runner.os }}-v2

      - name: Install Fitz
        run: |
          if [ ! -f ~/.cargo/bin/fitz ]; then
            cargo install --git https://github.com/Thegreekman76/fitz
          fi
          fitz --version

      - name: Library tests
        run: fitz test

      - name: Verify counter example compiles
        working-directory: examples/counter
        run: fitz check

      - name: Verify chat example compiles
        working-directory: examples/chat
        run: fitz check
