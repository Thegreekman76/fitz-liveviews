# Builds the MkDocs Material site AND the live client-WASM gallery, then
# deploys the combined bundle to GitHub Pages.
#
# GitHub Pages allows ONE deployment per repo (the `pages` concurrency
# group). So docs + the wasm gallery are assembled into a SINGLE `site/`
# artifact here — mkdocs into `site/`, the compiled gallery into
# `site/live/` — and deployed once. The live gallery ends up at
# https://thegreekman76.github.io/fitz-liveviews/live/.
#
# Prerequisite: repo Settings → Pages → Source = "GitHub Actions".
# Without this, the deploy step fails (no target).

name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'README.md'
      - 'examples/**/README.md'
      - 'examples/**/src/**'
      - 'examples/wasm-gallery/**'
      - '.github/workflows/docs.yml'
      - '.github/requirements-docs.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- MkDocs Material site -> site/ ---
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-docs.txt

      - name: Install MkDocs Material
        run: pip install -r .github/requirements-docs.txt

      - name: Build site
        run: mkdocs build --strict

      # --- Live client-WASM gallery -> site/live/ ---
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry, Fitz + wasm-pack binaries, gallery build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/fitz
            ~/.cargo/bin/wasm-pack
            examples/wasm-gallery/target
          key: pages-wasm-${{ runner.os }}-v4

      - name: Install Fitz (the `fitz` CLI)
        run: |
          if [ ! -f ~/.cargo/bin/fitz ]; then
            cargo install --git https://github.com/Thegreekman76/fitz
          fi
          fitz --version

      - name: Install wasm-pack
        run: |
          if [ ! -f ~/.cargo/bin/wasm-pack ]; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi
          wasm-pack --version

      - name: Build the wasm gallery + course preview bins
        working-directory: examples/wasm-gallery
        # The manifest declares one bin per component plus a composed
        # `gallery` root (`Gallery.fitzv`) that mounts all of them. The live
        # `/live/` page runs the composed gallery; the course chapters and
        # the Client-WASM guide embed single-component bins via
        # `/live/embed/?c=<name>` (matches the `KNOWN` whitelist in
        # embed.html). `showcase` composes the SSR companion UI via the CW.6
        # `flv` passthrough, `fileupload` uses `data-flv-file` (v0.29.3), and
        # `showcase` now includes ProgressBar/Spinner which need mixed
        # attribute interpolation (v0.29.4) — so the runner needs `fitz` >=
        # v0.29.4. The cache key (bumped to -v4) forces a fresh `cargo install`
        # of the current `main` binary.
        run: |
          fitz build --bin gallery --target wasm-client
          for c in counter toggle tabs stepper rating accordion modal todolist namelist carousel photo showcase fileupload loader; do
            fitz build --bin "$c" --target wasm-client
          done

      - name: Assemble site/live
        run: |
          mkdir -p site/live/pkg site/live/embed/pkg
          cp examples/wasm-gallery/index.html site/live/
          cp examples/wasm-gallery/target/wasm/gallery/gallery.js site/live/pkg/
          cp examples/wasm-gallery/target/wasm/gallery/gallery_bg.wasm site/live/pkg/
          cp examples/wasm-gallery/embed.html site/live/embed/index.html
          for c in counter toggle tabs stepper rating accordion modal todolist namelist carousel photo showcase fileupload loader; do
            cp "examples/wasm-gallery/target/wasm/$c/$c.js" site/live/embed/pkg/
            cp "examples/wasm-gallery/target/wasm/$c/${c}_bg.wasm" site/live/embed/pkg/
          done
          echo "== site/live ==" && ls -R site/live

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
