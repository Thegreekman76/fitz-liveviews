# SSR → client hydration of a composition tree WITH a region (Phase 11, needs
# Fitz core v0.41.4). Same App.fitzv compiled two ways: `[[bin]] app` (wasm) +
# `[[bin]] prerender` (classic, prints the server HTML seeding index.html's #app).
[package]
name = "hydration-composition-regions-demo"
version = "0.1.0"
edition = "2026"
description = "SSR → client hydration of a composition tree with a {#for} region (Phase 11)."

[dependencies]
fitz_liveviews = { path = "../.." }

[[bin]]
name = "app"
main = "App.fitzv"
target = "wasm-client"
mount = "#app"

[[bin]]
name = "prerender"
main = "prerender.fitz"
